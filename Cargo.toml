[workspace]
resolver = "2"
members = ["crates/biogit-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BioGit"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
